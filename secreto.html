<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Educación de Matemáticas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #1e1e2e;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    h1 { color: #89b4fa; margin-bottom: 10px; }
    p { color: #cdd6f4; max-width: 500px; }

    .card {
      margin-top: 25px;
      background: #313244;
      padding: 25px 30px;
      border-radius: 14px;
      width: 100%;
      max-width: 340px;
      text-align: left;
    }
    .campo { margin-bottom: 14px; }
    .campo label {
      display: block;
      margin-bottom: 6px;
      color: #cdd6f4;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .campo-clave { position: relative; }
    .campo input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #45475a;
      background: #1e1e2e;
      color: #f5f5f5;
      font-size: 1rem;
    }
    .campo-clave input { padding-right: 40px; }
    .campo input:focus { outline: 2px solid #89b4fa; }
    .boton-ver-clave {
      position: absolute;
      top: 50%;
      right: 4px;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border: 0;
      background: none;
      font-size: 1.1rem;
      line-height: 1;
      color: #a6adc8;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      margin-top: 6px;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: bold;
      color: #1e1e2e;
      background: #89b4fa;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn:hover { background: #74c7ec; transform: scale(1.02); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .switch-link {
      display: inline-block;
      margin-top: 14px;
      color: #89b4fa;
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: underline;
    }

    .estado {
      margin-top: 10px;
      min-height: 18px;
      font-size: 0.9rem;
      color: #f38ba8;
    }

    .bienvenida {
      margin-top: 25px;
      color: #a6e3a1;
      font-weight: bold;
    }
    .logout-link {
      margin-top: 10px;
      color: #cdd6f4;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
      opacity: 0.75;
    }

    .logo-inicio {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: 1px solid #45475a;
      border-radius: 50%;
      background: #313244;
      font-size: 1.4rem;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: transform .14s ease, background .14s ease;
    }
    .logo-inicio:hover { transform: translateY(-2px); background: #3b3d54; }
    .logo-inicio:focus-visible { outline: 3px solid #89b4fa; outline-offset: 2px; }
  </style>
</head>
<body>
  <a href="https://marconevi-lab.github.io/Educacion-de-matematicas/usuarios.html" class="logo-inicio" title="Ir a la página de inicio" aria-label="Ir a la página de inicio">🏠</a>

  <h1>Educación de Matemáticas</h1>
  <p>Aprende matemáticas de forma fácil y entretenida.</p>

  <div id="bienvenida-box" class="bienvenida" style="display:none;"></div>
  <button id="comenzar-btn" class="btn" style="display:none;">▶️ Comenzar</button>
  <span id="logout-link" class="logout-link" style="display:none;">Cerrar sesión</span>

  <div id="auth-card" class="card">
    <div class="campo">
      <label for="usuario-input">Usuario</label>
      <input id="usuario-input" type="text" autocomplete="username">
    </div>
    <div class="campo campo-clave">
      <label for="clave-input">Contraseña</label>
      <input id="clave-input" type="password" autocomplete="current-password">
      <button type="button" id="boton-ver-clave" class="boton-ver-clave" title="Mostrar contraseña">👁️</button>
    </div>
    <button id="start-btn" class="btn">Iniciar sesión y comenzar</button>
    <p id="estado" class="estado"></p>
    <span id="switch-link" class="switch-link">¿No tienes cuenta? Créala</span>
  </div>

  <script>
    const DEST_ORIGIN = 'https://marconevi-lab.github.io';
    const DEST_URL = DEST_ORIGIN + '/Educacion-de-matematicas/inicio.html';
    const CLAVE_USUARIOS = 'edu-usuarios-local';
    const CLAVE_SESION = 'edu-sesion-local';

    const authCard = document.getElementById('auth-card');
    const usuarioInput = document.getElementById('usuario-input');
    const claveInput = document.getElementById('clave-input');
    const startBtn = document.getElementById('start-btn');
    const estadoEl = document.getElementById('estado');
    const switchLink = document.getElementById('switch-link');
    const bienvenidaBox = document.getElementById('bienvenida-box');
    const comenzarBtn = document.getElementById('comenzar-btn');
    const logoutLink = document.getElementById('logout-link');

    let mode = 'login'; // 'login' | 'register'

    function cargarUsuarios() {
      try {
        const guardado = JSON.parse(localStorage.getItem(CLAVE_USUARIOS));
        if (Array.isArray(guardado)) return guardado;
      } catch (e) {}
      return [];
    }
    function guardarUsuarios(lista) {
      localStorage.setItem(CLAVE_USUARIOS, JSON.stringify(lista));
    }
    function obtenerSesion() {
      try {
        return JSON.parse(localStorage.getItem(CLAVE_SESION));
      } catch (e) {
        return null;
      }
    }
    function guardarSesion(usuario) {
      localStorage.setItem(CLAVE_SESION, JSON.stringify({ usuario }));
    }
    function cerrarSesion() {
      localStorage.removeItem(CLAVE_SESION);
    }

    const botonVerClave = document.getElementById('boton-ver-clave');
    botonVerClave.addEventListener('click', () => {
      const verClave = claveInput.type === 'password';
      claveInput.type = verClave ? 'text' : 'password';
      botonVerClave.textContent = verClave ? '🙈' : '👁️';
      botonVerClave.title = verClave ? 'Ocultar contraseña' : 'Mostrar contraseña';
    });

    switchLink.addEventListener('click', () => {
      mode = mode === 'login' ? 'register' : 'login';
      estadoEl.textContent = '';
      startBtn.textContent = mode === 'login' ? 'Iniciar sesión y comenzar' : 'Crear cuenta y comenzar';
      switchLink.textContent = mode === 'login' ? '¿No tienes cuenta? Créala' : '¿Ya tienes cuenta? Inicia sesión';
    });

    function render() {
      const sesion = obtenerSesion();
      if (sesion) {
        authCard.style.display = 'none';
        bienvenidaBox.style.display = 'block';
        bienvenidaBox.textContent = `Sesión iniciada como ${sesion.usuario}`;
        comenzarBtn.style.display = 'block';
        logoutLink.style.display = 'inline-block';
      } else {
        authCard.style.display = 'block';
        bienvenidaBox.style.display = 'none';
        comenzarBtn.style.display = 'none';
        logoutLink.style.display = 'none';
      }
    }

    function enviar() {
      const usuario = usuarioInput.value.trim();
      const clave = claveInput.value;
      if (!usuario || !clave) {
        estadoEl.textContent = 'Completa usuario y contraseña.';
        return;
      }

      const usuarios = cargarUsuarios();

      if (mode === 'register') {
        if (usuarios.some((u) => u.usuario === usuario)) {
          estadoEl.textContent = 'Ese usuario ya existe. Inicia sesión en su lugar.';
          return;
        }
        usuarios.push({ usuario, clave });
        guardarUsuarios(usuarios);
        guardarSesion(usuario);
      } else {
        const encontrado = usuarios.find((u) => u.usuario === usuario && u.clave === clave);
        if (!encontrado) {
          estadoEl.textContent = 'Usuario o contraseña incorrectos.';
          return;
        }
        guardarSesion(usuario);
      }

      estadoEl.textContent = '';
      usuarioInput.value = '';
      claveInput.value = '';
      render();
    }

    logoutLink.addEventListener('click', () => {
      cerrarSesion();
      render();
    });

    let popup = null;
    let interval = null;

    function detenerIntentos() {
      if (interval) clearInterval(interval);
      interval = null;
    }

    comenzarBtn.addEventListener('click', () => {
      const sesion = obtenerSesion();
      if (!sesion) return;
      const usuarios = cargarUsuarios();
      const encontrado = usuarios.find((u) => u.usuario === sesion.usuario);
      if (!encontrado) {
        estadoEl.textContent = 'No se encontró la cuenta guardada.';
        return;
      }

      comenzarBtn.disabled = true;
      comenzarBtn.textContent = 'Entrando en la web real…';
      estadoEl.textContent = '';

      popup = window.open(DEST_URL, '_blank');
      if (!popup) {
        estadoEl.textContent = 'El navegador bloqueó la ventana emergente. Permite pop-ups e inténtalo de nuevo.';
        comenzarBtn.disabled = false;
        comenzarBtn.textContent = '▶️ Comenzar';
        return;
      }

      let intentos = 0;
      let intentadoRegistro = false;
      interval = setInterval(() => {
        intentos++;
        try {
          popup.postMessage({ tipo: 'edu-login', usuario: encontrado.usuario, clave: encontrado.clave }, DEST_ORIGIN);
        } catch (e) {
          // la pestaña aún no está lista; se reintenta
        }
        if (intentos > 25) {
          detenerIntentos();
          estadoEl.textContent = 'No se pudo confirmar el inicio de sesión en la web real.';
          comenzarBtn.disabled = false;
          comenzarBtn.textContent = '▶️ Comenzar';
        }
      }, 400);

      window.__eduMensajeHandler = (event) => {
        if (event.origin !== DEST_ORIGIN) return;
        const data = event.data;
        if (!data) return;

        if (data.tipo === 'edu-login-resultado') {
          if (data.ok) {
            detenerIntentos();
            if (popup) popup.focus();
            comenzarBtn.disabled = false;
            comenzarBtn.textContent = '▶️ Comenzar';
          } else if (!intentadoRegistro) {
            // No existe esa cuenta en la web real: la creamos con las mismas credenciales.
            intentadoRegistro = true;
            try {
              popup.postMessage({ tipo: 'edu-registro', usuario: encontrado.usuario, clave: encontrado.clave }, DEST_ORIGIN);
            } catch (e) {}
          }
        }

        if (data.tipo === 'edu-registro-resultado') {
          detenerIntentos();
          if (popup) popup.focus();
          comenzarBtn.disabled = false;
          comenzarBtn.textContent = '▶️ Comenzar';
          if (!data.ok) {
            estadoEl.textContent = data.mensaje || 'No se pudo iniciar sesión en la web real.';
          }
        }
      };
    });

    window.addEventListener('message', (event) => {
      if (window.__eduMensajeHandler) window.__eduMensajeHandler(event);
    });

    startBtn.addEventListener('click', enviar);
    [usuarioInput, claveInput].forEach((input) => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') enviar();
      });
    });

    render();
  </script>
</body>
</html>
