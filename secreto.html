<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Educación de Matemáticas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #1e1e2e;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    h1 { color: #89b4fa; margin-bottom: 10px; }
    p { color: #cdd6f4; max-width: 500px; }

    .card {
      margin-top: 25px;
      background: #313244;
      padding: 25px 30px;
      border-radius: 14px;
      width: 100%;
      max-width: 340px;
      text-align: left;
    }
    .campo { margin-bottom: 14px; }
    .campo label {
      display: block;
      margin-bottom: 6px;
      color: #cdd6f4;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .campo-clave { position: relative; }
    .campo input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #45475a;
      background: #1e1e2e;
      color: #f5f5f5;
      font-size: 1rem;
    }
    .campo-clave input { padding-right: 40px; }
    .campo input:focus { outline: 2px solid #89b4fa; }
    .boton-ver-clave {
      position: absolute;
      top: 50%;
      right: 4px;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border: 0;
      background: none;
      font-size: 1.1rem;
      line-height: 1;
      color: #a6adc8;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      margin-top: 6px;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: bold;
      color: #1e1e2e;
      background: #89b4fa;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn:hover { background: #74c7ec; transform: scale(1.02); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .switch-link {
      display: inline-block;
      margin-top: 14px;
      color: #89b4fa;
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: underline;
    }

    .estado {
      margin-top: 10px;
      min-height: 18px;
      font-size: 0.9rem;
      color: #f38ba8;
    }
  </style>
</head>
<body>
  <h1>Educación de Matemáticas</h1>
  <p>Aprende matemáticas de forma fácil y entretenida.</p>

  <div class="card">
    <div class="campo">
      <label for="usuario-input">Usuario</label>
      <input id="usuario-input" type="text" autocomplete="username">
    </div>
    <div class="campo campo-clave">
      <label for="clave-input">Contraseña</label>
      <input id="clave-input" type="password" autocomplete="current-password">
      <button type="button" id="boton-ver-clave" class="boton-ver-clave" title="Mostrar contraseña">👁️</button>
    </div>
    <button id="start-btn" class="btn">Iniciar sesión y comenzar</button>
    <p id="estado" class="estado"></p>
    <span id="switch-link" class="switch-link">¿No tienes cuenta? Créala</span>
  </div>

  <script>
    const DEST_ORIGIN = 'https://marconevi-lab.github.io';
    const DEST_URL = DEST_ORIGIN + '/Educacion-de-matematicas/inicio.html';

    const usuarioInput = document.getElementById('usuario-input');
    const claveInput = document.getElementById('clave-input');
    const startBtn = document.getElementById('start-btn');
    const estadoEl = document.getElementById('estado');
    const switchLink = document.getElementById('switch-link');

    let mode = 'login'; // 'login' | 'register'
    let popup = null;
    let interval = null;

    const botonVerClave = document.getElementById('boton-ver-clave');
    botonVerClave.addEventListener('click', () => {
      const verClave = claveInput.type === 'password';
      claveInput.type = verClave ? 'text' : 'password';
      botonVerClave.textContent = verClave ? '🙈' : '👁️';
      botonVerClave.title = verClave ? 'Ocultar contraseña' : 'Mostrar contraseña';
    });

    switchLink.addEventListener('click', () => {
      mode = mode === 'login' ? 'register' : 'login';
      estadoEl.textContent = '';
      startBtn.textContent = mode === 'login' ? 'Iniciar sesión y comenzar' : 'Crear cuenta y comenzar';
      switchLink.textContent = mode === 'login' ? '¿No tienes cuenta? Créala' : '¿Ya tienes cuenta? Inicia sesión';
    });

    function detenerIntentos() {
      if (interval) clearInterval(interval);
      interval = null;
    }

    function enviar() {
      const usuario = usuarioInput.value.trim();
      const clave = claveInput.value;
      if (!usuario || !clave) {
        estadoEl.style.color = '#f38ba8';
        estadoEl.textContent = 'Completa usuario y contraseña.';
        return;
      }

      estadoEl.textContent = '';
      startBtn.disabled = true;
      startBtn.textContent = 'Entrando…';

      popup = window.open(DEST_URL, '_blank');
      if (!popup) {
        estadoEl.style.color = '#f38ba8';
        estadoEl.textContent = 'El navegador bloqueó la ventana emergente. Permite pop-ups e inténtalo de nuevo.';
        restablecerBoton();
        return;
      }

      const tipoMensaje = mode === 'login' ? 'edu-login' : 'edu-registro';
      let intentos = 0;
      interval = setInterval(() => {
        intentos++;
        try {
          popup.postMessage({ tipo: tipoMensaje, usuario, clave }, DEST_ORIGIN);
        } catch (e) {
          // la pestaña aún no está lista; se reintenta
        }
        if (intentos > 25) {
          detenerIntentos();
          estadoEl.style.color = '#f38ba8';
          estadoEl.textContent = 'No se pudo confirmar la operación.';
          restablecerBoton();
        }
      }, 400);
    }

    function restablecerBoton() {
      startBtn.disabled = false;
      startBtn.textContent = mode === 'login' ? 'Iniciar sesión y comenzar' : 'Crear cuenta y comenzar';
    }

    window.addEventListener('message', (event) => {
      if (event.origin !== DEST_ORIGIN) return;
      const data = event.data;
      if (!data || (data.tipo !== 'edu-login-resultado' && data.tipo !== 'edu-registro-resultado')) return;

      detenerIntentos();
      if (data.ok) {
        estadoEl.style.color = '#a6e3a1';
        estadoEl.textContent = 'Sesión iniciada. Continúa en la pestaña que se abrió.';
        if (popup) popup.focus();
      } else {
        estadoEl.style.color = '#f38ba8';
        estadoEl.textContent = data.mensaje || 'Usuario o contraseña incorrectos.';
        if (popup) popup.close();
      }
      restablecerBoton();
    });

    startBtn.addEventListener('click', enviar);
    [usuarioInput, claveInput].forEach((input) => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') enviar();
      });
    });
  </script>
</body>
</html>
