<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Educación de Matemáticas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fontsource-opendyslexic/5.3.0/index.css">
  <style>
    :root {
      --color-fondo: #1e1e2e;
      --color-texto: #f5f5f5;
      --color-titulo: #89b4fa;
      --color-texto-suave: #cdd6f4;
      --color-card-bg: #313244;
      --color-input-bg: #1e1e2e;
      --color-input-borde: #45475a;
      --color-icono: #a6adc8;
      --color-acento: #89b4fa;
      --color-acento-hover: #74c7ec;
      --color-boton-texto: #1e1e2e;
      --color-error: #f38ba8;
      --color-exito: #a6e3a1;
      --tam-texto: 1;
    }

    :root[data-contraste="alto"] {
      --color-fondo: #000 !important;
      --color-texto: #fff !important;
      --color-titulo: #fff !important;
      --color-texto-suave: #fff !important;
      --color-card-bg: #000 !important;
      --color-input-bg: #000 !important;
      --color-input-borde: #fff !important;
      --color-icono: #fff !important;
      --color-acento: #ffd60a !important;
      --color-acento-hover: #ffea00 !important;
      --color-boton-texto: #000 !important;
      --color-error: #ff6b81 !important;
      --color-exito: #7cffb2 !important;
    }

    :root[data-movimiento="reducido"] *,
    :root[data-movimiento="reducido"] *::before,
    :root[data-movimiento="reducido"] *::after {
      transition: none !important;
      animation: none !important;
    }

    :root[data-fuente="dislexia"] body {
      font-family: "Open Dyslexic", Arial, sans-serif;
    }

    [data-contraste="alto"] .card,
    [data-contraste="alto"] .campo input,
    [data-contraste="alto"] .logo-inicio,
    [data-contraste="alto"] .logo-config {
      border-width: 2px;
    }

    * { box-sizing: border-box; }
    html { font-size: calc(16px * var(--tam-texto)); }
    body {
      font-family: Arial, sans-serif;
      background: var(--color-fondo);
      color: var(--color-texto);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      transition: background .2s ease, color .2s ease;
    }
    h1 { color: var(--color-titulo); margin-bottom: 10px; }
    p { color: var(--color-texto-suave); max-width: 500px; }

    .card {
      margin-top: 25px;
      background: var(--color-card-bg);
      padding: 25px 30px;
      border-radius: 14px;
      width: 100%;
      max-width: 340px;
      text-align: left;
    }
    .campo { margin-bottom: 14px; }
    .campo label {
      display: block;
      margin-bottom: 6px;
      color: var(--color-texto-suave);
      font-size: 0.85rem;
      font-weight: 700;
    }
    .campo-clave { position: relative; }
    .campo input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--color-input-borde);
      background: var(--color-input-bg);
      color: var(--color-texto);
      font-size: 1rem;
    }
    .campo-clave input { padding-right: 40px; }
    .campo input:focus { outline: 2px solid var(--color-acento); }
    .boton-ver-clave {
      position: absolute;
      top: 50%;
      right: 4px;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border: 0;
      background: none;
      font-size: 1.1rem;
      line-height: 1;
      color: var(--color-icono);
      cursor: pointer;
    }

    .btn {
      width: 100%;
      margin-top: 6px;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--color-boton-texto);
      background: var(--color-acento);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn:hover { background: var(--color-acento-hover); transform: scale(1.02); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .switch-link {
      display: inline-block;
      margin-top: 14px;
      color: var(--color-acento);
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: underline;
    }

    .estado {
      margin-top: 10px;
      min-height: 18px;
      font-size: 0.9rem;
      color: var(--color-error);
    }

    .bienvenida {
      margin-top: 25px;
      color: var(--color-exito);
      font-weight: bold;
    }
    .logout-link {
      margin-top: 10px;
      color: var(--color-texto-suave);
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
      opacity: 0.75;
    }

    .logo-inicio, .logo-config {
      position: fixed;
      top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: 1px solid var(--color-input-borde);
      border-radius: 50%;
      background: var(--color-card-bg);
      font-size: 1.4rem;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: transform .14s ease, background .14s ease;
      cursor: pointer;
    }
    .logo-inicio { right: 20px; }
    .logo-config { left: 20px; border: none; }
    .logo-inicio:hover, .logo-config:hover { transform: translateY(-2px); background: #3b3d54; }
    .logo-inicio:focus-visible, .logo-config:focus-visible { outline: 3px solid var(--color-acento); outline-offset: 2px; }

    .panel-config {
      position: fixed;
      top: 76px;
      left: 20px;
      z-index: 10;
      width: min(280px, calc(100vw - 40px));
      padding: 20px;
      border: 1px solid var(--color-input-borde);
      border-radius: 16px;
      background: var(--color-card-bg);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      text-align: left;
    }
    .panel-config[hidden] { display: none; }
    .panel-config h2 { margin: 0 0 14px; font-size: 1rem; color: var(--color-titulo); }
    .panel-config .campo { margin-bottom: 14px; }
    .panel-config .campo:last-child { margin-bottom: 0; }
    .panel-config select {
      width: 100%;
      min-height: 42px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--color-input-borde);
      background: var(--color-input-bg);
      color: var(--color-texto);
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <a href="https://marconevi-lab.github.io/Educacion-de-matematicas/usuarios.html" class="logo-inicio" title="Ir a la página de inicio" aria-label="Ir a la página de inicio">🏠</a>
  <button type="button" class="logo-config" id="boton-config" title="Configuración" aria-label="Configuración">⚙️</button>

  <div class="panel-config" id="panel-config" hidden>
    <h2>⚙️ Configuración</h2>
    <div class="campo">
      <label for="select-tamano">Tamaño de texto</label>
      <select id="select-tamano">
        <option value="normal">Normal</option>
        <option value="grande">Grande</option>
      </select>
    </div>
    <div class="campo">
      <label for="select-contraste">Contraste</label>
      <select id="select-contraste">
        <option value="normal">Normal</option>
        <option value="alto">Alto contraste</option>
      </select>
    </div>
    <div class="campo">
      <label for="select-fuente">Fuente</label>
      <select id="select-fuente">
        <option value="normal">Normal</option>
        <option value="dislexia">Apta para dislexia</option>
      </select>
    </div>
    <div class="campo">
      <label for="select-movimiento">Animaciones</label>
      <select id="select-movimiento">
        <option value="normal">Activadas</option>
        <option value="reducido">Reducidas</option>
      </select>
    </div>
  </div>

  <h1>Educación de Matemáticas</h1>
  <p>Aprende matemáticas de forma fácil y entretenida.</p>

  <div id="bienvenida-box" class="bienvenida" style="display:none;"></div>
  <button id="comenzar-btn" class="btn" style="display:none;">▶️ Comenzar</button>
  <span id="logout-link" class="logout-link" style="display:none;">Cerrar sesión</span>

  <div id="auth-card" class="card">
    <div class="campo">
      <label for="usuario-input">Usuario</label>
      <input id="usuario-input" type="text" autocomplete="username">
    </div>
    <div class="campo campo-clave">
      <label for="clave-input">Contraseña</label>
      <input id="clave-input" type="password" autocomplete="current-password">
      <button type="button" id="boton-ver-clave" class="boton-ver-clave" title="Mostrar contraseña">👁️</button>
    </div>
    <button id="start-btn" class="btn">Iniciar sesión y comenzar</button>
    <p id="estado" class="estado"></p>
    <span id="switch-link" class="switch-link">¿No tienes cuenta? Créala</span>
  </div>

  <script>
    const DEST_ORIGIN = 'https://marconevi-lab.github.io';
    const DEST_URL = DEST_ORIGIN + '/Educacion-de-matematicas/inicio.html';
    const CLAVE_USUARIOS = 'edu-usuarios-local';
    const CLAVE_SESION = 'edu-sesion-local';

    const authCard = document.getElementById('auth-card');
    const usuarioInput = document.getElementById('usuario-input');
    const claveInput = document.getElementById('clave-input');
    const startBtn = document.getElementById('start-btn');
    const estadoEl = document.getElementById('estado');
    const switchLink = document.getElementById('switch-link');
    const bienvenidaBox = document.getElementById('bienvenida-box');
    const comenzarBtn = document.getElementById('comenzar-btn');
    const logoutLink = document.getElementById('logout-link');

    let mode = 'login'; // 'login' | 'register'

    function cargarUsuarios() {
      try {
        const guardado = JSON.parse(localStorage.getItem(CLAVE_USUARIOS));
        if (Array.isArray(guardado)) return guardado;
      } catch (e) {}
      return [];
    }
    function guardarUsuarios(lista) {
      localStorage.setItem(CLAVE_USUARIOS, JSON.stringify(lista));
    }
    function obtenerSesion() {
      try {
        return JSON.parse(localStorage.getItem(CLAVE_SESION));
      } catch (e) {
        return null;
      }
    }
    function guardarSesion(usuario) {
      localStorage.setItem(CLAVE_SESION, JSON.stringify({ usuario }));
    }
    function cerrarSesion() {
      localStorage.removeItem(CLAVE_SESION);
    }

    const botonVerClave = document.getElementById('boton-ver-clave');
    botonVerClave.addEventListener('click', () => {
      const verClave = claveInput.type === 'password';
      claveInput.type = verClave ? 'text' : 'password';
      botonVerClave.textContent = verClave ? '🙈' : '👁️';
      botonVerClave.title = verClave ? 'Ocultar contraseña' : 'Mostrar contraseña';
    });

    switchLink.addEventListener('click', () => {
      mode = mode === 'login' ? 'register' : 'login';
      estadoEl.textContent = '';
      startBtn.textContent = mode === 'login' ? 'Iniciar sesión y comenzar' : 'Crear cuenta y comenzar';
      switchLink.textContent = mode === 'login' ? '¿No tienes cuenta? Créala' : '¿Ya tienes cuenta? Inicia sesión';
    });

    function render() {
      const sesion = obtenerSesion();
      if (sesion) {
        authCard.style.display = 'none';
        bienvenidaBox.style.display = 'block';
        bienvenidaBox.textContent = `Sesión iniciada como ${sesion.usuario}`;
        comenzarBtn.style.display = 'block';
        logoutLink.style.display = 'inline-block';
      } else {
        authCard.style.display = 'block';
        bienvenidaBox.style.display = 'none';
        comenzarBtn.style.display = 'none';
        logoutLink.style.display = 'none';
      }
    }

    function enviar() {
      const usuario = usuarioInput.value.trim();
      const clave = claveInput.value;
      if (!usuario || !clave) {
        estadoEl.textContent = 'Completa usuario y contraseña.';
        return;
      }

      const usuarios = cargarUsuarios();

      if (mode === 'register') {
        if (usuarios.some((u) => u.usuario === usuario)) {
          estadoEl.textContent = 'Ese usuario ya existe. Inicia sesión en su lugar.';
          return;
        }
        usuarios.push({ usuario, clave });
        guardarUsuarios(usuarios);
        guardarSesion(usuario);
      } else {
        const encontrado = usuarios.find((u) => u.usuario === usuario && u.clave === clave);
        if (!encontrado) {
          estadoEl.textContent = 'Usuario o contraseña incorrectos.';
          return;
        }
        guardarSesion(usuario);
      }

      estadoEl.textContent = '';
      usuarioInput.value = '';
      claveInput.value = '';
      render();
    }

    logoutLink.addEventListener('click', () => {
      cerrarSesion();
      render();
    });

    let popup = null;
    let interval = null;

    function detenerIntentos() {
      if (interval) clearInterval(interval);
      interval = null;
    }

    comenzarBtn.addEventListener('click', () => {
      const sesion = obtenerSesion();
      if (!sesion) return;
      const usuarios = cargarUsuarios();
      const encontrado = usuarios.find((u) => u.usuario === sesion.usuario);
      if (!encontrado) {
        estadoEl.textContent = 'No se encontró la cuenta guardada.';
        return;
      }

      comenzarBtn.disabled = true;
      comenzarBtn.textContent = 'Entrando en la web real…';
      estadoEl.textContent = '';

      popup = window.open(DEST_URL, '_blank');
      if (!popup) {
        estadoEl.textContent = 'El navegador bloqueó la ventana emergente. Permite pop-ups e inténtalo de nuevo.';
        comenzarBtn.disabled = false;
        comenzarBtn.textContent = '▶️ Comenzar';
        return;
      }

      let intentos = 0;
      let intentadoRegistro = false;
      interval = setInterval(() => {
        intentos++;
        try {
          popup.postMessage({ tipo: 'edu-login', usuario: encontrado.usuario, clave: encontrado.clave }, DEST_ORIGIN);
        } catch (e) {
          // la pestaña aún no está lista; se reintenta
        }
        if (intentos > 25) {
          detenerIntentos();
          estadoEl.textContent = 'No se pudo confirmar el inicio de sesión en la web real.';
          comenzarBtn.disabled = false;
          comenzarBtn.textContent = '▶️ Comenzar';
        }
      }, 400);

      window.__eduMensajeHandler = (event) => {
        if (event.origin !== DEST_ORIGIN) return;
        const data = event.data;
        if (!data) return;

        if (data.tipo === 'edu-login-resultado') {
          if (data.ok) {
            detenerIntentos();
            if (popup) popup.focus();
            comenzarBtn.disabled = false;
            comenzarBtn.textContent = '▶️ Comenzar';
          } else if (!intentadoRegistro) {
            // No existe esa cuenta en la web real: la creamos con las mismas credenciales.
            intentadoRegistro = true;
            try {
              popup.postMessage({ tipo: 'edu-registro', usuario: encontrado.usuario, clave: encontrado.clave }, DEST_ORIGIN);
            } catch (e) {}
          }
        }

        if (data.tipo === 'edu-registro-resultado') {
          detenerIntentos();
          if (popup) popup.focus();
          comenzarBtn.disabled = false;
          comenzarBtn.textContent = '▶️ Comenzar';
          if (!data.ok) {
            estadoEl.textContent = data.mensaje || 'No se pudo iniciar sesión en la web real.';
          }
        }
      };
    });

    window.addEventListener('message', (event) => {
      if (window.__eduMensajeHandler) window.__eduMensajeHandler(event);
    });

    startBtn.addEventListener('click', enviar);
    [usuarioInput, claveInput].forEach((input) => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') enviar();
      });
    });

    render();

    // Configuración (tamaño, contraste, fuente, animaciones), exclusiva de esta página.
    const CLAVE_CONFIG = 'edu-config-secreto';

    function cargarConfig() {
      try {
        const guardado = JSON.parse(localStorage.getItem(CLAVE_CONFIG));
        if (guardado && typeof guardado === 'object') return guardado;
      } catch (e) {}
      return { tamano: 'normal', contraste: 'normal', fuente: 'normal', movimiento: 'normal' };
    }

    function guardarConfig(cfg) {
      localStorage.setItem(CLAVE_CONFIG, JSON.stringify(cfg));
    }

    function aplicarConfig(cfg) {
      const raiz = document.documentElement;
      raiz.style.setProperty('--tam-texto', cfg.tamano === 'grande' ? '1.15' : '1');
      if (cfg.contraste === 'alto') raiz.setAttribute('data-contraste', 'alto');
      else raiz.removeAttribute('data-contraste');
      if (cfg.fuente === 'dislexia') raiz.setAttribute('data-fuente', 'dislexia');
      else raiz.removeAttribute('data-fuente');
      if (cfg.movimiento === 'reducido') raiz.setAttribute('data-movimiento', 'reducido');
      else raiz.removeAttribute('data-movimiento');
    }

    const selectTamano2 = document.querySelector('#select-tamano');
    const selectContraste = document.querySelector('#select-contraste');
    const selectFuente = document.querySelector('#select-fuente');
    const selectMovimiento = document.querySelector('#select-movimiento');
    const botonConfig = document.querySelector('#boton-config');
    const panelConfig = document.querySelector('#panel-config');

    let configSecreto = cargarConfig();
    selectTamano2.value = configSecreto.tamano;
    selectContraste.value = configSecreto.contraste;
    selectFuente.value = configSecreto.fuente;
    selectMovimiento.value = configSecreto.movimiento;
    aplicarConfig(configSecreto);

    botonConfig.addEventListener('click', () => {
      panelConfig.hidden = !panelConfig.hidden;
    });

    document.addEventListener('click', (e) => {
      if (!panelConfig.hidden && !panelConfig.contains(e.target) && e.target !== botonConfig) {
        panelConfig.hidden = true;
      }
    });

    function escucharCambioConfig(select, campo) {
      select.addEventListener('change', () => {
        configSecreto[campo] = select.value;
        guardarConfig(configSecreto);
        aplicarConfig(configSecreto);
      });
    }

    escucharCambioConfig(selectTamano2, 'tamano');
    escucharCambioConfig(selectContraste, 'contraste');
    escucharCambioConfig(selectFuente, 'fuente');
    escucharCambioConfig(selectMovimiento, 'movimiento');
  </script>
</body>
</html>
